<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>طلب حجز</title>

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: 'cairo', sans-serif;
    }

    body{
      background:#161616;
      color:#fff;
      padding: 40px 0;
      overflow-x: hidden;
    }
    .header{
      width:100%;
  position:relative;
  display:flex;
  justify-content:center;
  align-items:center;
  margin-bottom:40px;
  padding:10px 0;
}
    .container{
      width:850px;
      margin:auto;
    }


    /* BACK BUTTON */

.back-home{
  position:absolute;
  right:0;
  text-decoration:none;
  color:#000;
  background:linear-gradient(145deg,#f3d57e,#c8962e);
  padding:14px 28px;
  border-radius:16px;
  font-size:17px;
  font-weight:700;
  transition:.3s;
  box-shadow:0 10px 20px rgba(212,168,79,.18);
}

.back-home:hover{
  transform:translateY(-2px);
  box-shadow:0 14px 25px rgba(212,168,79,.28);
}

    /* CARD */

    .card{
      background:#161616;
      border:2px solid #d4a84f;
      border-radius:28px;
      padding:28px;
      margin-bottom:30px;
      box-shadow:
      0 0 30px rgba(212,168,79,.08),
      inset 0 0 15px rgba(212,168,79,.04);
    }

    .card-header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:25px;
      border-bottom:1px solid rgba(212,168,79,.25);
      padding-bottom:18px;
    }

    .card-header h3{
      font-size:20px;
      color:#e7c16b;
      font-weight:700;
    }

    .reveal{
opacity:0;
transform:translateY(80px);
transition:1s;
}

.reveal.active{
opacity:1;
transform:translateY(0);

}

    .icon{
      width:45px;
      height:45px;
      border-radius:14px;
      background:linear-gradient(145deg,#f3d57e,#c8962e);
      display:flex;
      align-items:center;
      justify-content:center;
      color:#000;
      font-size:20px;
      font-weight:bold;
    }

    /* INPUTS */

    .input-group{
      margin-bottom:20px;
    }

    label{
      display:block;
      margin-bottom:10px;
      color:#e7c16b;
      font-size:15px;
      font-weight:600;
    }

    input,
    textarea,
    select{
      width:100%;
      background:#101010;
      border:1.5px solid rgba(212,168,79,.25);
      height:56px;
      border-radius:18px;
      padding:0 18px;
      color:#fff;
      outline:none;
      transition:.3s;
      font-size:15px;
    }

    textarea{
      height:160px;
      padding-top:18px;
      resize:none;
    }

    input:focus,
    textarea:focus,
    select:focus{
      border-color:#d4a84f;
      box-shadow:0 0 15px rgba(212,168,79,.18);
    }

    /* BUTTONS */

    button
    {
      transition:.3s;
    }
    button:hover{

      transform:scale(1.05);

     }

    /* ACTIONS */

    .actions{
      display:flex;
      justify-content:flex-start;
      gap:18px;
      margin-top:25px;
    }

    .publish{
      background:linear-gradient(145deg,#f3d57e,#c8962e);
      color:#000;
      border:none;
      width:220px;
      height:60px;
      border-radius:20px;
      font-size:20px;
      font-weight:700;
      cursor:pointer;
      box-shadow:0 10px 25px rgba(212,168,79,.22);
    }

    .cancel{
      background:transparent;
      border:none;
      color:#d4a84f;
      font-size:20px;
      cursor:pointer;
      font-weight:700;
    }

    .title-page{
      display:flex;
      align-items:center;
      gap:12px;
      margin-bottom:30px;
      color:#f0c96c;
      font-size:35px;
      font-weight:700;
    }



    @media(max-width:900px){

      .container{
        width:92%;
      }



      .actions{
        flex-direction:column;
      }

      .publish{
        width:100%;
      }

    }

  </style>
</head>
<body>

  <!-- HEADER -->

  <header class="header">

    <div class="loader"></div>
    <!-- زر الرجوع -->
    <a href="index.html" class="back-home">
      ← الرئيسية
    </a>

  </header>
    <div class="container">

  <div class="title-page" id="pageTitle">طلب حجز عقار</div>

    <!-- المعلومات الأساسية -->
    <div class="card">
      <div class="card reveal">
      <div class="card-header">
        <div class="icon">i</div>
        <h3>معلومات العقار</h3>
      </div>

      <div class="input-group">
        <label>اسم العقار</label>
        <input type="text" id="name" class="input" readonly>
    </div>


      <div class="input-group">
        <label>نوع العقار</label>
        <input type="text" id="propertyType" readonly>
    </div>

    <div class="input-group">
        <label>السعر</label>
        <input type="text" id="price" readonly>
      </div>

      <div class="input-group">
        <label>المدينة / المنطقة</label>
        <input type="text" id="city" readonly>
      </div>

      </div>
    </div>



    <!--بيانات المستخدم-->

    <div class="card">

        <div class="card-header">
            <div class="icon">👤</div>
          <h3>بيانات المستخدم</h3>
        </div>

        <div class="grid-2">

          <div class="input-group">
            <label>الاسم الكامل</label>
            <input type="text" id="fullname" placeholder="ادخل الاسم الكامل">
          </div>

          <div class="input-group">
            <label>البريد الالكتروني</label>
            <input  id="email" type="email" placeholder ="example@gmail.com">
          </div>

          <div class="input-group">
            <label>رقم الهاتف</label>
            <input  id="phone-number" type="text" placeholder= "مثال: 0987654321">
          </div>

        </div>

      </div>



    <!--معلومات الحجز-->
    <div class="card" id="bookingInfo">

        <div class="card">

            <div class="card-header">
              <div class="icon">📍</div>
              <h3 >معلومات الحجز</h3>
            </div>

            <div class="grid-2">

              <div class="input-group">

                <label>تاريخ بداية الحجز</label>

                <input type="date" id="sdate" placeholder="مثال:....">
              </div>

              <div class="input-group">
                <label>تاريخ نهاية الحجز</label>

                <input type="date" id="edate">
              </div>


                <div class="input-group">
                    <label>عدد أيام الحجز</label>
                    <input type="number" id="days" readonly>
                </div>

            </div>

    </div>

    </div>

    </div>

    <!-- ACTIONS -->
    <div class="actions">

        <button class="publish" id="publishBtn">
            إرسال طلب الحجز
        </button>

        <button class="cancel" id="backBtn" >
        العودة
        </button>
    </div>

  </div>
  <script src="../js/rental-Booking.js"></script>
</body>
</html>
