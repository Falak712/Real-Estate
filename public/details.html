<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل العقار</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Cairo',sans-serif;
}

body{
    background:#161616;
    color:#fff;
    overflow-x:hidden;
    padding:10px 0;
}

/* HEADER */

header{
    width:100%;
    height:50px;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
    margin-bottom:40px;
    border-bottom:1px solid rgba(212,168,79,.2);

}

.logo{
    color:#d4a84f;
    font-size:25px;

    font-family: 'arial', sans-serif;
}

.home-btn{

    position:absolute;
  right: 20px;
  text-decoration:none;
  color:#000;
  background:linear-gradient(145deg,#f3d57e,#c8962e);
  padding:14px 28px;
  border-radius:16px;
  font-size:17px;
  font-weight:700;
  transition:.3s;
  box-shadow:0 10px 20px rgba(212,168,79,.18);

}
.home-btn:hover{

    transform:translateY(-2px);
  box-shadow:0 14px 25px rgba(212,168,79,.28);
}


/* CONTAINER */

.container{
    width:850px;
    margin:auto;

    background:#161616;

    border:2px solid #d4a84f;

    border-radius:30px;

    padding:35px;

    box-shadow:
    0 0 30px rgba(212,168,79,.08),
    inset 0 0 15px rgba(212,168,79,.04);
}
.container p{

    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:30px;
    color:#f0c96c;
    font-size:25px;
    font-weight:700;
}

/* القسم العلوي */

.top-section{
    display:flex;
    gap:40px;
    align-items:flex-start;
}


/* الصور */

.gallery{
    flex:1;
}

.main-image{
    width: 450px;
    height:330px;

    object-fit:cover;

    border-radius:25px;

    border:2px solid #d4a84f;
}

.thumbnails{
    display:flex;

    gap:15px;
    margin-top:20px;
}

.thumbnails img{
    width:80px;
    height:70px;

    object-fit:cover;

    cursor:pointer;

    border-radius:18px;

    border:2px solid #d4a84f;
}


/* بطاقة المعلومات */

.info-card{

    width:450px;

    background:#161616;

    border:2px solid #d4a84f;

    border-radius:28px;

    padding:28px;

    text-align:center;

    box-shadow:
    0 0 30px rgba(212,168,79,.08),
    inset 0 0 15px rgba(212,168,79,.04);
}





.info-card h1{
    font-size:20px;
    margin-top:20px;
    line-height:1.8;
}

.location{
    margin-top:15px;

    color:#d4a84f;

    font-size:15px;
}

.price{
    margin-top:25px;

    color:#d4a84f;

    font-size:30px;
}

.status{
    margin-top:25px;

    font-size:15px;
}

.status span{
    color:#00ff7f;
}


/* الأزرار */

.buy-btn,
.rent-btn{

    width:100%;

    height:56px;

    margin-top:18px;

    border:none;

    border-radius:18px;

    background:linear-gradient(145deg,#f3d57e,#c8962e);

    color:black;

    font-size:17px;

    font-weight:700;

    cursor:pointer;

    transition:.3s;
}

.buy-btn:hover,
.rent-btn:hover{
    transform:scale(1.03);
}


/* أيقونات القلب والحفظ */

.icons{
    display:flex;
    justify-content:center;
    gap:15px;
    margin-top:25px;
}

.icons div{

    width:50px;

    height:50px;

    border:2px solid #d4a84f;

    border-radius:15px;

    display:flex;

    justify-content:center;

    align-items:center;

    cursor:pointer;
}


/* وصف العقار */

.description{

    margin-top:40px;

    background:#161616;

    border:2px solid #d4a84f;

    border-radius:28px;

    padding:30px;

    box-shadow:
    0 0 20px rgba(212,168,79,.08),
    inset 0 0 10px rgba(212,168,79,.03);
}

.description h2{

    color:#d4a84f;

    margin-bottom:20px;

    font-size:22px;
}

.description p{

    color:#ddd;

    line-height:2;

    font-size:15px;
}


/* التفاصيل */

.features{

    margin-top:35px;

    display:grid;

    grid-template-columns:repeat(4,1fr);

    gap:20px;
}

.feature{

    background:#161616;

    border:2px solid #d4a84f;

    border-radius:25px;

    padding:25px;

    text-align:center;

    box-shadow:
    0 0 20px rgba(212,168,79,.06),
    inset 0 0 10px rgba(212,168,79,.03);
}

.feature i{

    color:#d4a84f;

    font-size:30px;

    margin-bottom:15px;
}

.feature h3{

    font-size:24px;

    margin-bottom:10px;
}

.feature p{

    color:#aaa;

    font-size:14px;
}


/* RESPONSIVE */

@media(max-width:900px){

    .container{
        width:95%;
    }

    .top-section{
        flex-direction:column;
    }

    .info-card{
        width:100%;
    }

    .features{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:600px){

    .features{
        grid-template-columns:1fr;
    }

}

    </style>
</head>
<body>

    <header>

        <div class="logo">
            The MAGIC
        </div>

        <a href="index.html" class="home-btn">
            الرئيسية
        </a>

    </header>
    <!-- الحواف الذهبية للصفحة-->
    <div class="details-container">

    <!--المحتوى-->
    <div class="container">

        <p>تفاصيل العقار</p>

    <!--القسم يلي فوق-->
    <div class="top-section">

        <!-- الصور -->
        <div class="gallery">

            <img class="main-image" id="mainImage" src="/villa.jpg">

            <div class="thumbnails">

                <img onclick="changeImage(this)" src="/villa.jpg">
                <img onclick="changeImage(this)" src="/img1.jpg">
                <img onclick="changeImage(this)" src="/img2.jpg">
                <img onclick="changeImage(this)" src="/img3.jpg">
                <img onclick="changeImage(this)" src="/img4.jpg">

            </div>

        </div>

        <!-- المعلومات -->
        <div class="info-card">

            <div class="info-content">

                <!-- العنوان -->
                <h2 id="title">عنوان العقار</h2>

                <!-- الموقع -->
                <p class="location" id="location">
                    <i class="fa-solid fa-location-dot"></i>
                    الموقع
                </p>

                <!-- السعر -->
                <h2 class="price" id="price">$0</h2>

                <!-- الحالة -->
                <div class="status">
                    حالة العقار :
                    <span id="status">متاح</span>
                </div>

                <!-- الأزرار -->
                <button class="buy-btn">شراء العقار</button>
                <button class="rent-btn">استئجار العقار</button>

            </div>

            <!-- الأيقونات -->
            <div class="icons">

                <div>
                    <i class="fa-regular fa-heart"></i>
                </div>

                <div>
                    <i class="fa-regular fa-bookmark"></i>
                </div>

            </div>

        </div>

    </div>

    <!-- وصف العقار -->

    <div class="description">

        <h2>وصف العقار</h2>

        <p id="description">
            وصف العقار يظهر هنا...
        </p>

    </div>


    <!-- التفاصيل -->
    <div class="features">

        <div class="feature">
            <i class="fa-solid fa-expand"></i>
            <p>المساحة</p>
            <h3 id="space">--</h3>
        </div>

        <div class="feature">
            <i class="fa-solid fa-bed"></i>
            <p>غرف النوم</p>
            <h3 id="rooms">--</h3>
        </div>

        <div class="feature">
            <i class="fa-solid fa-bath"></i>
            <p>الحمامات</p>
            <h3 id="baths">--</h3>
        </div>

        <div class="feature">
            <i class="fa-regular fa-compass"></i>
            <p>الجهة</p>
            <h3 id="direction">--</h3>
        </div>

    </div>

    <script src="details.js"></script>

    </body>
</html>
