<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> الملف الشخصي </title>
    <link rel="stylesheet" href="profile.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
 <header class="navbar">
    <div class="container"> 
     <div class="logo">
    <img src="/public/images/logo.png">
</div>
<nav>
    <a href="#">الرئيسية</a>
    <a href="#properties">العقارات</a>
    <a href="#about">من نحن</a>
</nav>
    <a href="profile.html" class="profile-btn">
        <i class="fa-solid fa-user"></i>
    </a>
</div>
  <div class="header-actions">
            <a href="index.html" class="header-logout" id="logoutBtn">
                <i class="fa-solid fa-right-from-bracket"></i>
                تسجيل خروج
            </a>
        </div>
 </header>

    <h1 class="title"> الملف الشّخصي </h1>
    <div class="right-side"> 
   <section class="account-info"> 

    <h1 class="section-title"> <i class="fa-solid fa-user"> </i>
        معلومات الحساب </h1>

    <div class="account-card">
<div class="info-row">
    <span class="label">
        <i class="fa-solid fa-user"></i>
        الاسم الكامل
    </span>
    <div class="input-container">
        <input
        type="text"
        class="value"
        id="fullName"
        readonly>
        <small id="nameHint" class="input-hint"></small>
    </div>
</div>
<div class="info-row">
    <span class="label">
        <i class="fa-solid fa-phone"></i>
        رقم الهاتف
    </span>
    <div class="input-container">
        <input
        type="text"
        class="value"
        id="phone"
        readonly>
        <small id="phoneHint" class="input-hint"></small>
    </div>
</div>

<div class="info-row">
    <span class="label">
        <i class="fa-solid fa-envelope"></i>
        البريد الإلكتروني
    </span>
    <div class="input-container">
        <input
        type="email"
        class="value"
        id="email"
        readonly>
        <small id="emailHint" class="input-hint"></small>
    </div>
</div>

<div class="info-row">
<span class="label"> <i class="fa-solid fa-calendar-days"></i>
    تاريخ إنشاء الحساب </span>
</div>
</div>
</section>

   <section class="settings"> 
    <h1 class="section-title"><i class="fa-solid fa-gear"></i>
      الإعدادات
    </h1>
    <div class="settings-card"> 

    <div>  
        <button class="edit-profile"> <i class="fa-solid fa-user-pen"></i>
             تعديل الملف الشخصي </button>
    </div>

     <div> 
        <button class="edit-password"> <i class=" fa-solid fa-key"></i>
             تعديل كلمة المرور </button>
    </div>

    <div> 
        <button class="logout"> <i class="fa-solid fa-right-from-bracket"></i>
            تسجيل الخروج </button>
    </div> 
    </div>

   </section>
</div>
   <section class="realestates-info"> 
    <h1 class="section-title"> <i class="fa-solid fa-building"></i>
         عقاراتي </h1>
     <div class="realestates-container">

    <div class="realestate-card"> 
        
    <div class="realestate-image">

    </div>
    </div>

    <div class="realestate-card"> 
    <div class="realestate-image">

    </div>
    </div>

     <div class="realestate-card"> 
    <div class="realestate-image">
   </div>
    </div>
    <div class="more-realestate">
    <button class="more-btn"> <i class="fa-solid fa-arrow-left"></i>
        عرض المزيد
    </button>
    </div>
    </div>
    </div>
   </section>

  
   <div class="password-modal" id="passwordModal">

    <div class="password-box">

        <h2>تغيير كلمة المرور</h2>
        <input 
        type="password" 
        id="oldPassword"
        placeholder="كلمة المرور الحالية">

        <input 
        type="password" 
        id="newPassword"
        placeholder="كلمة المرور الجديدة">
        <small id="passwordHint" class="password-hint">
         يجب أن تحتوي كلمة المرور على 8 أحرف على الأقل، وتتضمن حرفًا ورقمًا ورمزًا خاصًا.
         nader@123
        </small>
        <input 
        type="password" 
        id="confirmPassword"
        placeholder="تأكيد كلمة المرور">

        <div class="password-buttons">
            <button id="savePassword" disabled>
                حفظ
            </button>

            <button id="closePassword">
                إلغاء
            </button>
        </div>

    </div> 
</div> 
<script src="profile.js"></script>
</body>
</html>
