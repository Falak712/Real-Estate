<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>طلب حجز</title>

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: 'cairo', sans-serif;
    }

    body{
      background:#161616;
      color:#fff;
      padding: 40px 0;
      overflow-x: hidden;
      background: linear-gradient(135deg, #0a0a0a 0%, #111111 35%,#1a1a1a 60%,#c8962e 120%);
    background-size: 200% 200%;
    animation: bgMove 8s ease-in-out infinite;
        }


@keyframes bgMove {
  0% {
    background-position: 0% 50%;
  }
  50% {
    background-position: 100% 50%;
  }
  100% {
    background-position: 0% 50%;
  }
}
    .container{
      width:850px;
      margin:auto;
    }

 /* الهيدر */
 header {
            /*لون الهيدر مع الخلفية ممكن غيره للابيض*/


            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            position: sticky;
            z-index: 10;
            display: flex;
            top: 0;
        }
          .logo{
            display:flex;
            justify-content:center;
            align-items:center;
            margin: 0;
            padding: 0;
            margin-left: 60px;

        }
        header .logo img{
            height:80px;
            width:auto;
            object-fit:contain;
        }

        nav a {
            margin:0 20px;
            color:#c8962e;
            transition: .3s;
            font-weight: 500;
        }
        nav a:hover {

        color: #ffffff;
        }

        a{
            text-decoration: none;

        }

        nav{
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .container{
            width:850px;
            margin:auto;
            margin-top: 80px;
        }

        /* شريط التنقل */


        .navbar
        {
            background-color: #0b0b0b;
            border-bottom:1px solid rgba(200,150,46,.3);
            box-shadow:0 5px 20px rgba(200,150,46,.08);
            padding: 7px 0;
            position: fixed;
            display: flex;
            top: 0;
            right: 0;
            width: 100%;
            z-index: 1000;
        }
        .navbar .container
        {
            max-width: 1400px;
            margin: auto;
            display: flex;
            align-items: center;
        }

        .nav-links{

        align-items: center;
        gap: 20px;
        }

        .menu-btn{
    display:none;
    font-size:28px;
    color:#c8962e;
    cursor:pointer;
}

        .header-logout, .header-add {
            padding: 8px 12px;
            border:1px solid #c8962e;
            border-radius:13px;

            background:black;
            color:#c8962e;
            text-align: center;
            font-size:17px;

            cursor:pointer;
            transition:.3s;
         }
            .header-add:hover,
            .header-logout:hover {
                color: #c8962e;

                transform:scale(1.05);
                transform: translateY(-4px);
                box-shadow:0 15px 35px rgba(234, 197, 93, 0.25);
            }

    /* CARD */

    .card{
      background:#161616;
      border:2px solid #c8962e;
      border-radius:28px;
      padding:28px;
      margin-bottom:30px;
      box-shadow:
      0 0 30px rgba(212,168,79,.08),
      inset 0 0 15px rgba(212,168,79,.04);
    }

    .card-header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:25px;
      border-bottom:1px solid rgba(212,168,79,.25);
      padding-bottom:18px;
      box-shadow:
    0 0 20px rgba(212,168,79,.06),
    inset 0 0 10px rgba(212,168,79,.03);
    }

    .card:hover{
        transform: translateY(-5px);
    transform: translateY(-8px);
    box-shadow:0 15px 35px rgba(201,168,76,.25);
    }

    .card-header h3{
      font-size:20px;
      color:#c8962e;
      font-weight:700;
    }


    .icon{
      width:45px;
      height:45px;
      border-radius:14px;
      background:linear-gradient(145deg,#f3d57e,#c8962e);
      display:flex;
      align-items:center;
      justify-content:center;
      color:#000;
      font-size:20px;
      font-weight:bold;
    }

    /* INPUTS */

    .input-group{
      margin-bottom:20px;
    }

    label{
      display:block;
      margin-bottom:10px;
      color:#c8962e;
      font-size:15px;
      font-weight:600;
    }

    input,
    textarea,
    select{
      width:100%;
      background:#101010;
      border:1.5px solid rgba(212,168,79,.25);
      height:56px;
      border-radius:18px;
      padding:0 18px;
      color:#fff;
      outline:none;
      transition:.3s;
      font-size:15px;
    }

    textarea{
      height:160px;
      padding-top:18px;
      resize:none;
    }
    /* لون أيقونة التاريخ */
input[type="date"]::-webkit-calendar-picker-indicator {
    filter: invert(1);
    cursor: pointer;
}

    input:focus,
    textarea:focus,
    select:focus{
      border-color:#c8962e;
      box-shadow:0 0 15px rgba(212,168,79,.18);
    }

    /* BUTTONS */

    button
    {
      transition:.3s;
    }
    button:hover{

      transform:scale(1.05);

     }

    /* ACTIONS */

    .actions{
      display:flex;
      justify-content:flex-start;
      gap:18px;
      margin-top:25px;
    }

    .publish{
      background:linear-gradient(145deg,#f3d57e,#c8962e);
      color:#000;
      border:none;
      width:220px;
      height:60px;
      border-radius:20px;
      font-size:20px;
      font-weight:700;
      cursor:pointer;
      box-shadow:0 10px 25px rgba(212,168,79,.22);
    }

    .cancel{
      background:transparent;
      border:none;
      color:#c8962e;
      font-size:20px;
      cursor:pointer;
      font-weight:700;
    }

    .title-page{
      display:flex;
      align-items:center;
      gap:12px;
      margin-bottom:30px;
      color:#c8962e;
      font-size : 20px;;
      font-weight:700;
    }
    @media (max-width: 768px) {

.menu-btn {
    display: block;
    font-size: 30px;
    color: #c8962e;
    cursor: pointer;
}

.nav-links {
    display: none;
    flex-direction: column;
    position: absolute;
    top: 70px;
    right: 0;
    left: 0;
    background: #111;
    padding: 10px 0;
    gap: 10px;
    z-index: 1000;
}

.nav-links.active {
    display: flex;
    flex-direction: column;
}

.nav-links a {
    display: block;
    text-align: center;
    padding: 12px;
    width: 70%;
    margin: auto;
    background: rgba(255,255,255,0.05);
    border-radius: 8px;
    color: white;
    text-decoration: none;
}

.nav-links a:hover {
    background: #d4a24c;
    color: black;
}

.search-box {
    flex-direction: column;
    width: 70%;
}

.search-box select,
.search-box input,
.search-box button {
    width: 100%;
}

.navbar .container{
        flex-wrap:wrap;
        justify-content:space-between;
        align-items:center;
    }

}

    @media(max-width:900px){

      .container{
        width:92%;
      }



      .actions{
        flex-direction:column;
      }

      .publish{
        width:100%;
      }

    }

  </style>
</head>
<body>

  <!-- الهيدر -->
  <header class="navbar">
    <div class="container">
        <span class="logo">
            <img src="../images/logo.png" class="img">
        </span>

        <div class="menu-btn" id="menubtn">
            <i class="fa-solid fa-bars"></i>
        </div>

        <div class="center-nav">

        </div>
        <nav class="nav-links" id="navlinks">
        <a href="../main/index.html">الرئيسية</a>
        <a href="index.html#properties">العقارات</a>
        <a href="index.html#about">من نحن</a>
        <a href="#">إدارة النظام</a>
        <a href="../main/index.html" class="header-logout" id="logoutBtn"> <i class="fa-solid fa-right-from-bracket"></i> تسجيل خروج </a>

        </nav>
    </div>
</header>

    <div class="container">

  <div class="title-page" id="pageTitle">طلب حجز عقار</div>

    <!-- المعلومات الأساسية -->
    <div class="card">
      <div class="card">
      <div class="card-header">
        <div class="icon">i</div>
        <h3>معلومات العقار</h3>
      </div>

      <div class="input-group">
        <label>اسم العقار</label>
        <input type="text" id="name" class="input" readonly>
    </div>


      <div class="input-group">
        <label>نوع العقار</label>
        <input type="text" id="propertyType" readonly>
    </div>

    <div class="input-group">
        <label>السعر</label>
        <input type="text" id="price" readonly>
      </div>

      <div class="input-group">
        <label>المدينة / المنطقة</label>
        <input type="text" id="city" readonly>
      </div>

      </div>
    <!--بيانات المستخدم-->

    <div class="card">

        <div class="card-header">
            <div class="icon">👤</div>
          <h3>بيانات المستخدم</h3>
        </div>

        <div class="grid-2">

          <div class="input-group">
            <label>الاسم الكامل</label>
            <input type="text" id="fullname" placeholder="ادخل الاسم الكامل">
          </div>

          <div class="input-group">
            <label>البريد الالكتروني</label>
            <input  id="email" type="email" placeholder ="example@gmail.com">
          </div>

          <div class="input-group">
            <label>رقم الهاتف</label>
            <input  id="phone-number" type="text" placeholder= "مثال: 0987654321">
          </div>

        </div>

      </div>

    <!--معلومات الحجز-->
    <div class="card" id="bookingInfo">

        <div class="card">

            <div class="card-header">
              <div class="icon">📍</div>
              <h3 >معلومات الحجز</h3>
            </div>

            <div class="grid-2">

              <div class="input-group">

                <label>تاريخ بداية الحجز</label>

                <input type="date" id="sdate" placeholder="مثال:....">
              </div>

              <div class="input-group">
                <label>تاريخ نهاية الحجز</label>

                <input type="date" id="edate">
              </div>


                <div class="input-group">
                    <label>عدد أيام الحجز</label>
                    <input type="number" id="days" readonly>
                </div>

            </div>
        </div>

    </div>

    </div>

    </div>

    <!-- ACTIONS -->
    <div class="actions">

        <button class="publish" id="publishBtn">
            إرسال طلب الحجز
        </button>

        <button class="cancel" id="backBtn" >
        العودة
        </button>
    </div>

  </div>
  <script src="../realEstate/rental-Booking.js"></script>
</body>
</html>
