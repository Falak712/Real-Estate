<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>إنشاء حساب | Magic Estate</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

  <style>

    *{

      margin:0;
      padding:0;
      box-sizing: border-box;
      font-family: "Cairo", sans-serif;
    }

    body{

      min-height:100vh;
      background:#050505;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:40px;
      background: linear-gradient(135deg, #0a0a0a 0%, #111111 35%,#1a1a1a 60%,#c8962e 120%);
        background-size: 200% 200%;
        animation: bgMove 8s ease-in-out infinite;
    }

@keyframes bgMove {
  0% {
    background-position: 0% 50%;
  }
  50% {
    background-position: 100% 50%;
  }
  100% {
    background-position: 0% 50%;
  }
}
    /* الكونتينر */

    .register-container{

      width:1250px;
      max-width:100%;

      min-height:760px;

      background:#0b0b0b;

      border-radius:35px;

      display:grid;

      grid-template-columns:1fr 1fr;

      border:1px solid rgba(212,168,79,.15);

      box-shadow:
      0 20px 60px rgba(0,0,0,.55);

      animation:fadeIn 1s ease;

    }

    /* القسم اليسار */

    .left-side{

      position:relative;
      background:
      linear-gradient(
      rgba(0,0,0,.72),
      rgba(0,0,0,.78)
      ),
      url("https://tse1.mm.bing.net/th/id/OIP.aBfaNr67zgGd4lBXLIVzrwHaLH?r=0&rs=1&pid=ImgDetMain&o=7&rm=3");

      background-size:cover;
      background-position:center;
      padding:70px;

      display:flex;
      flex-direction:column;
      justify-content:center;

    }

    .badge{

      width:max-content;

      padding:10px 22px;

      border-radius:30px;

      border:1px solid rgba(212,168,79,.25);

      color:#c8962e;

      background:rgba(255,255,255,.03);

      margin-bottom:25px;

    }

    .left-side h1{

      color:white;

      font-size:28px;

      line-height:1.3;

      margin-bottom:25px;

      font-weight:800;

    }

    .left-side p{

      color:#d6d6d6;

      line-height:2;

      font-size:18px;

      max-width:520px;

    }

    /* القسم اليمين */

    .right-side{

      background:#0b0b0b;

      padding:70px;

      position:relative;

      display:flex;
      flex-direction:column;
      justify-content:center;

    }

    .back{
      position:absolute;

      top:35px;
      right:35px;

      text-decoration:none;

      color:#c8962e;

      font-size:18px;

      transition:.3s;

    }

    .back:hover{

      transform:translateX(-5px);

    }

    .register-icon{

      width:85px;
      height:85px;

      border-radius:25px;

      display:flex;
      justify-content:center;
      align-items:center;

      background:
      linear-gradient(
      145deg,
      #f3d57e,
      #c8962e
      );

      color:#000;

      font-size:20px;

      margin-bottom:30px;

      box-shadow:
      0 10px 30px rgba(212,168,79,.25);

    }

    .right-side h2{

      color:white;

      font-size:28px;

      margin-bottom:12px;

    }

    .subtitle{

      color:#aaa;

      line-height:1.9;

      margin-bottom:40px;

      font-size:17px;

    }

    /* الفورم */

    .input-group{

      margin-bottom:22px;

    }

    .input-group label{

      display:block;

      color:#c8962e;

      margin-bottom:10px;

      font-size:15px;

    }

    .input-box{

      width:100%;
      height:62px;

      border-radius:18px;

      border:2px solid rgba(239, 190, 92, 0.15);

      background:#111;

      padding:0 20px;

      color:white;

      outline:none;

      font-size:16px;

      transition:.3s;

    }

    .input-box:focus{

      border-color:#c8962e;

      box-shadow:
      0 0 15px rgba(212,168,79,.15);

    }

    /* الزر */

    .register-btn{

      width:100%;
      height:65px;

      border:none;

      border-radius:18px;

      margin-top:15px;

      background:
      linear-gradient(
      145deg,
      #f3d57e,
      #c8962e
      );

      color:#000;

      font-size:18px;

      font-weight:800;

      cursor:pointer;

      transition:.4s;

      box-shadow:
      0 10px 25px rgba(212,168,79,.25);

    }

    .register-btn:hover{

      transform:translateY(-4px);

      box-shadow:
      0 15px 35px rgba(212,168,79,.3);

    }
    .password-box{

position:relative;

}

.show-password{

position:absolute;

left:20px;

top:50%;

transform:translateY(-50%);

cursor:pointer;

color:#c8962e;

font-size:20px;

transition:.3s;

}

.show-password:hover{

color:#c8962e;

transform:
translateY(-50%)
scale(1.1);

}

    /* انيميشن */

    @keyframes fadeIn{

      from{

        opacity:0;
        transform:translateY(30px);

      }

      to{

        opacity:1;
        transform:translateY(0);

      }

    }

    /* ريسبونسف */

    @media(max-width:1000px){

      .register-container{

        grid-template-columns:1fr;

      }

      .left-side{

        display:none;

      }

    }

    /*خلفية للموبايل*/
    @media(max-width:768px){

        body{
    padding:0;

    }

    .register-container{

    display:block;

    width:100%;

    min-height:700px;

    background:
    linear-gradient(
        rgba(0,0,0,.75),
        rgba(0,0,0,.85)
    ),
    url("https://tse1.mm.bing.net/th/id/OIP.aBfaNr67zgGd4lBXLIVzrwHaLH?r=0&rs=1&pid=ImgDetMain&o=7&rm=3");

    background-size:cover;

    background-position:center;

    background-repeat:no-repeat;
}

.right-side{

background:transparent;

padding:80px 25px 40px;

min-height:700px;

display:flex;

flex-direction:column;

justify-content:center;

}

.left-side{
    display:none;
}


.right-side{
    background:transparent;

    min-height:700px;
}


.right-side h2,
.subtitle,
.input-group label{
    color:white;
}


.input-box{
    background:rgba(0,0,0,.65);
    backdrop-filter:blur(8px);
}


.login-icon{
    margin:auto;
    margin-bottom:25px;
}

}

  </style>

</head>

<body>

  <div class="register-container">

    <!-- اليسار -->

    <div class="left-side">

      <div class="badge">
        عقارات حصرية
      </div>

      <h1>
        ابدأ رحلتك العقارية<br>
        معنا اليوم
      </h1>

      <p>
        أنشئ حسابك الآن للوصول إلى أفضل العقارات،
        إضافة إعلاناتك الخاصة وإدارة ممتلكاتك بسهولة.
      </p>

    </div>

    <!-- اليمين -->

    <div class="right-side">

      <a href="../main/index.html" class="back">
        ← العودة للرئيسية
      </a>

      <div class="register-icon">
        ✦
      </div>

      <h2>
        إنشاء حساب جديد
      </h2>

      <p class="subtitle">
        قم بإنشاء حساب جديد للوصول إلى جميع
        خدمات ومميزات منصة Magic Estate.
      </p>

      <!-- الاسم -->

      <div class="input-group">

        <label>
          الاسم الكامل
        </label>

        <input
        type="text"
        class="input-box"
        id="fullname"
        placeholder="أدخل اسمك الكامل">

      </div>

      <!-- البريد -->

      <div class="input-group">

        <label>
          البريد الإلكتروني
        </label>

        <input
        type="email"
        class="input-box"
        id="email"
        placeholder="name@example.com">

      </div>

      <!-- كلمة المرور -->

      <div class="input-group">

        <label>
          كلمة المرور
        </label>

        <div class="password-box">

            <input
            type="password"
            class="input-box"
            id="password"
            placeholder="••••••••"
            minlength="8">

            <span class="show-password" id="togglePassword">
              👁
            </span>
          </div>
      </div>

      <!-- تأكيد كلمة المرور -->

      <div class="input-group">

        <label>
          تأكيد كلمة المرور
        </label>

        <div class="password-box">

            <input
            type="password"
            class="input-box"
            id="confirm-password"
            placeholder="••••••••"
            minlength="8">

            <span class="show-password" id="toggleConfirmPassword">
              👁
            </span>

          </div>
      </div>
      <!--رقم المستخدم-->
      <div class="input-group">

        <label>
          رقم الهاتف
        </label>

        <input
        type="text"
        class="input-box"
        id="phone-number"
        placeholder="أدخل رقم هاتفك"
        maxlength="10">

      </div>
      <!-- الزر -->
      <button class="register-btn">
        إنشاء الحساب
      </button>

    </div>
  </div>
  <script src="../auth/register.js"></script>
</body>
</html>
