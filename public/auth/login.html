<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Magic Estate</title>
    <style>
           *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Cairo',sans-serif;
    }

    body{

      background:#050505;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:35px;
    }

    /* الخلفية */

    body::before{
      content:"";
      position:absolute;
      inset:0;

      background:
      radial-gradient(circle at top right,
      rgba(212,168,79,.18),
      transparent 30%),

      radial-gradient(circle at bottom left,
      rgba(212,168,79,.12),
      transparent 30%);

      z-index:-1;

    }

    /* container*/

    .login-container{

      width:1200px;
      max-width:100%;

      min-height:700px;
      background:#0b0b0b;
      border:1px solid rgba(212,168,79,.18);
      border-radius:35px;
      display:grid;
      grid-template-columns:1fr 1fr;

      box-shadow:
      0 20px 60px rgba(0,0,0,.55);
      animation:fadeIn 1s ease;
    }

    /* القسم اليسار */

    .left-side{
      position:relative;
      padding:60px;
      background-size:cover;
      background-position:center;
      display:flex;
      flex-direction:column;
      justify-content:center;
      background:
      linear-gradient(
      rgba(0,0,0,.72),
      rgba(0,0,0,.78)
      )
    }

    .badge{

      width:max-content;

      padding:10px 22px;

      border-radius:30px;

      border:1px solid rgba(212,168,79,.3);

      color:#f3d57e;

      margin-bottom:25px;

      background:rgba(255,255,255,.03);

      backdrop-filter:blur(10px);
    }

    .left-side h1{

      color:white;

      font-size:58px;

      line-height:1.3;

      margin-bottom:25px;

      font-weight:800;

    }

    .left-side p{

      color:#d5d5d5;

      line-height:2;

      font-size:19px;

      max-width:520px;

    }
    /* القسم اليمين */

    .right-side{

      background:#0b0b0b;

      padding:70px;

      display:flex;
      flex-direction:column;
      justify-content:center;

      position:relative;

    }

    .back{

      position:absolute;

      top:35px;
      right:35px;

      text-decoration:none;

      color:#d4a84f;

      font-size:18px;

      transition:.3s;
    }

    .back:hover{

      transform:translateX(-5px);

    }

    .login-icon{

      width:85px;
      height:85px;

      border-radius:25px;

      display:flex;
      justify-content:center;
      align-items:center;

      font-size:35px;

      background:
      linear-gradient(
      145deg,
      #f3d57e,
      #c8962e
      );

      color:#000;

      margin-bottom:30px;

      box-shadow:
      0 10px 30px rgba(212,168,79,.3);

    }
    .password-box{

position:relative;

}

    /*انشاء خساب*/

    .create-account{
    margin-top:25px;
    text-align:center;
    color:#aaa;
    font-size:16px;
}

.create-account a{

color:#d4a84f;

text-decoration:none;

font-weight:700;

margin-right:5px;

transition:.3s;

}

.create-account a:hover{

color:#f3d57e;

text-shadow:
0 0 12px rgba(212,168,79,.35);

}

    .right-side h2{

      color:white;

      font-size:50px;

      margin-bottom:12px;

    }

    .subtitle{

      color:#aaa;

      line-height:1.9;

      margin-bottom:40px;

      font-size:18px;
    }

    /* الفورم */

    .input-group{

      margin-bottom:25px;
    }

    .input-group label{

      display:block;

      color:#d4a84f;

      margin-bottom:12px;

      font-size:15px;

    }

    .input-box{

      width:100%;
      height:65px;

      border-radius:18px;

      background:#111;

      border:1px solid rgba(212,168,79,.18);

      padding:0 20px;

      color:white;

      font-size:16px;

      outline:none;

      transition:.3s;

    }

    .input-box:focus{

      border-color:#d4a84f;

      box-shadow:
      0 0 15px rgba(212,168,79,.18);

    }

    .forgot{

      display:inline-block;

      margin-top:10px;

      color:#d4a84f;

      text-decoration:none;

      font-size:15px;

    }

    .login-btn{

      width:100%;

      height:65px;

      border:none;

      border-radius:18px;

      margin-top:30px;

      background:
      linear-gradient(
      145deg,
      #f3d57e,
      #c8962e
      );

      color:#000;

      font-size:18px;

      font-weight:800;

      cursor:pointer;

      transition:.4s;

      box-shadow:
      0 10px 30px rgba(212,168,79,.28);

    }

    .login-btn:hover{

      transform:translateY(-4px);

      box-shadow:
      0 15px 35px rgba(212,168,79,.35);

    }

    .divider{

      text-align:center;

      margin:30px 0;

      color:#777;

      position:relative;
    }

    .divider::before,
    .divider::after{

      content:"";

      position:absolute;

      width:40%;
      height:1px;

      background:#222;

      top:50%;

    }

    .divider::before{
      right:0;
    }

    .divider::after{
      left:0;
    }

    .google-btn{


      width:100%;
      height:65px;

      border-radius:18px;

      border:1px solid rgba(212,168,79,.18);

      background:#111;

      color:white;

      font-size:17px;

      cursor:pointer;

      transition:.3s;

    }

    .google-btn:hover{

      border-color:#d4a84f;

      transform:translateY(-3px);

    }
    .google-btn img{

width:22px;

height:22px;
    }


    /* الانيميشن */

    @keyframes fadeIn{

      from{
        opacity:0;
        transform:translateY(30px);
      }

      to{
        opacity:1;
        transform:translateY(0);
      }

    }

    /* responsive*/

    @media(max-width:1000px){

      .login-container{

        grid-template-columns:1fr;

      }

      .left-side{

        display:none;

      }

    }


    </style>
</head>
<body>
    <div class="login-container">
        <!-- اليسار -->

    <div class="left-side">

        <div class="badge">
          عقارات حصرية
        </div>

        <h1>
          اكتشف منزل أحلامك<br>
          بسهولة ويسر
        </h1>

        <p>
          منصة متكاملة للبحث عن أفضل العقارات التي تناسب
          تطلعاتك مع خيارات متنوعة في أرقى المناطق.
        </p>
      </div>
      <!-- اليمين -->

      <div class="right-side">
        <a href="index.html" class="back">
          ← العودة للرئيسية
        </a>
        <div class="login-icon">
          ⌂
        </div>
        <h2>
          مرحبًا بك مجددًا
        </h2>
        <p class="subtitle">
          قم بتسجيل الدخول للوصول إلى حسابك
          وإدارة عقاراتك المفضلة.
        </p>

        <!-- Email -->
        <div class="input-group">
          <label>
            البريد الإلكتروني
          </label>
          <input
          type="email"
          class="input-box"
          id="email"
          placeholder="name@example.com">
        </div>

        <!-- Password -->
        <div class="input-group">
          <label>
            كلمة المرور
          </label>
          <input
          type="password"
          class="input-box"
          id="password"
          placeholder="••••••••">

          <a href="#" class="forgot">
            نسيت كلمة المرور؟
          </a>
        </div>

        <!-- Button -->
        <button class="login-btn" onclick="login(event)">
          تسجيل الدخول
        </button>
      </a>
        <div class="create-account">

          ليس لديك حساب؟

          <a href="register.html">
          إنشاء حساب
          </a>

        </div>
        <div class="divider">
            أو
        </div>
        <button class="google-btn">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg">
          المتابعة باستخدام غوغل
        </button>
      </div>
    </div>
    </div>
    <script src="login.js"></script>
</body>
</html>
