<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Login | Magic Estate</title>
    <style>
           *{
      margin:0;
      padding:0;
      box-sizing: border-box;
      font-family: 'Times New Roman', serif;
    }

    body{
      display:flex;
      justify-content:center;
      align-items:center;
      padding:50px;
      background: linear-gradient(135deg, #0a0a0a 0%, #111111 35%,#1a1a1a 60%,#c8962e 120%);
      background-size: 200% 200%;
      animation: bgMove 8s ease-in-out infinite;
    }

    @keyframes bgMove {
  0% {
    background-position: 0% 50%;
  }
  50% {
    background-position: 100% 50%;
  }
  100% {
    background-position: 0% 50%;
  }
}

    /* container*/

    .login-container{

      width:1200px;
      max-width:100%;

      min-height:700px;
      background:#0b0b0b;
      border:1px solid rgba(212,168,79,.18);
      border-radius:35px;
      display:grid;
      grid-template-columns:1fr 1fr;

      box-shadow:
      0 20px 60px rgba(0,0,0,.55);
      animation:fadeIn 1s ease;
    }

    /* القسم اليسار */

    .left-side{
        /*
      position:relative;
      padding:46px;
      background-size:cover;
      background-position:center;
      display:flex;
      flex-direction:column;
      justify-content:center;
      background:
      linear-gradient(
      rgba(0,0,0,.72),
      rgba(0,0,0,.78)
      )
      */

      position:relative;
      padding:46px;
      background-size:cover;
      background-position:center;

      display:flex;
      flex-direction:column;
      justify-content:center;

      background:
      linear-gradient(
      rgba(0,0,0,.72),
      rgba(0,0,0,.78)
      ),
      url("https://tse1.mm.bing.net/th/id/OIP.aBfaNr67zgGd4lBXLIVzrwHaLH?r=0&rs=1&pid=ImgDetMain&o=7&rm=3");

      background-size:cover;
      background-position:center;

    }

    .badge{

      width:max-content;

      padding:10px 22px;

      border-radius:30px;

      border:1px solid rgba(212,168,79,.3);

      color:#c8962e;

      margin-bottom:25px;

      background:rgba(255,255,255,.03);

      backdrop-filter:blur(10px);
    }

    .left-side h1{

      color:white;

      font-size:28px;

      line-height:1.3;

      margin-bottom:25px;

      font-weight:800;

    }

    .left-side p{

      color:#d5d5d5;

      line-height:2;

      font-size:19px;

      max-width:520px;

    }
    /* القسم اليمين */

    .right-side{

      background:#0b0b0b;

      padding:46px;
      font-size: 28px;
      display:flex;
      flex-direction:column;
      justify-content:center;

      position:relative;

    }
    .right-side h2{

      color:white;

      font-size:30px;

      margin-bottom:12px;

    }

    .back{

      position:absolute;

      top:35px;
      right:35px;

      text-decoration:none;

      color:#d4a84f;

      font-size:18px;

      transition:.3s;
    }

    .back:hover{

      transform:translateX(-5px);

    }

    .login-icon{

      width:85px;
      height:85px;

      border-radius:25px;

      display:flex;
      justify-content:center;
      align-items:center;

      font-size:35px;

      background:
      linear-gradient(
      145deg,
      #f3d57e,
      #c8962e
      );

      color:#000;

      margin-bottom:30px;

      box-shadow:
      0 10px 30px rgba(212,168,79,.3);

    }
    .password-box{

     position:relative;

    }

    /*انشاء خساب*/

    .create-account{
    margin-top:25px;
    text-align:center;
    color:#aaa;
    font-size:16px;
}

.create-account a{

color:#c8962e;

text-decoration:none;

font-weight:700;

margin-right:5px;

transition:.3s;

}

.create-account a:hover{

color:#c8962e;

text-shadow:
0 0 12px rgba(212,168,79,.35);

}

    .subtitle{

      color:#aaa;

      line-height:1.9;

      margin-bottom:40px;

      font-size:18px;
    }

    /* الفورم */

    .input-group{

      margin-bottom:25px;
    }

    .input-group label{

      display:block;

      color:#c8962e;

      margin-bottom:12px;

      font-size:15px;

    }

    .input-box{

      width:100%;
      height:65px;

      border-radius:18px;

      background:#111;

      border:1px solid rgba(212,168,79,.18);

      padding:0 20px;

      color:white;

      font-size:16px;

      outline:none;

      transition:.3s;

    }

    .input-box:focus{

      border-color:#c8962e;

      box-shadow:
      0 0 15px rgba(212,168,79,.18);

    }

    .forgot{

      display:inline-block;

      margin-top:10px;

      color:#c8962e;

      text-decoration:none;

      font-size:15px;

    }

    .login-btn{

      width:100%;

      height:65px;

      border:none;

      border-radius:18px;

      margin-top:30px;

      background:
      linear-gradient(
      145deg,
      #f3d57e,
      #c8962e
      );

      color:#000;

      font-size:18px;

      font-weight:800;

      cursor:pointer;

      transition:.4s;

      box-shadow:
      0 10px 30px rgba(212,168,79,.28);

    }

    .login-btn:hover{

      transform:translateY(-4px);

      box-shadow:
      0 15px 35px rgba(212,168,79,.35);

    }

    .divider{

      text-align:center;

      margin:30px 0;

      color:#777;

      position:relative;
    }

    .divider::before,
    .divider::after{

      content:"";

      position:absolute;

      width:40%;
      height:1px;

      background:#222;

      top:50%;

    }

    .divider::before{
      right:0;
    }

    .divider::after{
      left:0;
    }

    .google-btn{


      width:100%;
      height:65px;

      border-radius:18px;

      border:1px solid rgba(212,168,79,.18);

      background:#111;

      color:white;

      font-size:17px;

      cursor:pointer;

      transition:.3s;

    }

    .google-btn:hover{

      border-color:#c8962e;

      transform:translateY(-3px);

    }
    .google-btn img{

      width:22px;
      height:22px;
    }


    /* الانيميشن */

    @keyframes fadeIn{

      from{
        opacity:0;
        transform:translateY(30px);
      }

      to{
        opacity:1;
        transform:translateY(0);
      }

    }

    /* responsive*/

    @media(max-width:1000px){

      .login-container{

        grid-template-columns:1fr;

      }

      .left-side{

        display:none;

      }

    }
    /*للموبايل*/


@media (max-width:768px){

    body{
    padding:0;
}

.login-container{

grid-template-columns:1fr;

min-height:100vh;
width:100%;
border-radius:0;
background:
linear-gradient(
    rgba(0,0,0,.75),
    rgba(0,0,0,.85)
),
url("https://tse1.mm.bing.net/th/id/OIP.aBfaNr67zgGd4lBXLIVzrwHaLH?r=0&rs=1&pid=ImgDetMain&o=7&rm=3")
center / cover no-repeat;

}


.left-side{
    display:none;
}

.right-side{

background:transparent;

padding:50px 20px;

text-align:right;

}

.back{
    position:static;
    display:inline-block;
    margin-bottom:25px;
    font-size:16px;
}

.login-icon{
        align-self:flex-end;
        width:70px;
        height:70px;
        font-size:28px;
        margin-bottom:20px;
    }

.right-side h2{
    font-size:32px;
    margin-bottom:10px;
}

.subtitle{
    font-size:15px;
    line-height:1.7;
    margin-bottom:25px;
}

.input-group{
    margin-bottom:18px;
}

.input-box{
    height:55px;
    font-size:15px;
    border-radius:14px;
}

.login-btn,
.google-btn{
    height:55px;
    font-size:16px;
    border-radius:14px;
}

.create-account{
    font-size:14px;
}

.divider{
    margin:20px 0;
}
}


    </style>
</head>
<body>
    <div class="login-container">
        <!-- اليسار -->

    <div class="left-side">

        <div class="badge">
          عقارات حصرية
        </div>

        <h1>
          اكتشف منزل أحلامك<br>
          بسهولة ويسر
        </h1>

        <p>
          منصة متكاملة للبحث عن أفضل العقارات التي تناسب
          تطلعاتك مع خيارات متنوعة في أرقى المناطق.
        </p>
      </div>
      <!-- اليمين -->

      <div class="right-side">
        <a href="../main/index.html" class="back">
          ← العودة للرئيسية
        </a>
        <div class="login-icon">
          ⌂
        </div>
        <h2>
          مرحبًا بك مجددًا
        </h2>
        <p class="subtitle">
          قم بتسجيل الدخول للوصول إلى حسابك
          وإدارة عقاراتك المفضلة.
        </p>

        <!-- Email -->
        <div class="input-group">
          <label>
            البريد الإلكتروني
          </label>
          <input
          type="email"
          class="input-box"
          id="email"
          placeholder="name@gmail.com">
        </div>

        <!-- Password -->
        <div class="input-group">
          <label>
            كلمة المرور
          </label>
          <input
          type="password"
          class="input-box"
          id="password"
          placeholder="••••••••"
          minlength="8">

          <a href="#" class="forgot">
            نسيت كلمة المرور؟
          </a>
        </div>

        <!-- Button -->
         <a href="../main/index.html"></a>
        <button class="login-btn" onclick="login()" >
          تسجيل الدخول
        </button>

        <div class="create-account">

          ليس لديك حساب؟

          <a href="../auth/register.html">
          إنشاء حساب
          </a>

        </div>
        <div class="divider">
            أو
        </div>
        <button class="google-btn">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg">
          المتابعة باستخدام غوغل
        </button>
      </div>
    </div>
    </div>
    <script src="../auth/login.js"></script>
</body>
</html>
